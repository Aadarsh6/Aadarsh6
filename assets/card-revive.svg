<svg xmlns="http://www.w3.org/2000/svg" width="440" height="278" viewBox="0 0 440 278" role="img" aria-label="Revive AI: Autonomous revenue recovery for Razorpay">
<title>Revive AI: Autonomous revenue recovery for Razorpay</title>
<defs>
<style>.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace;} .s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;}</style>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1424"/><stop offset="1" stop-color="#0a0f1c"/></linearGradient>
<radialGradient id="gl" cx="430" cy="0" r="240" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5eead4" stop-opacity=".2"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient>
<clipPath id="cp"><rect width="440" height="278" rx="18"/></clipPath>

</defs>

<g clip-path="url(#cp)"><rect width="440" height="278" fill="url(#bg)"/><rect width="440" height="278" fill="url(#gl)"/></g>
<rect x=".5" y=".5" width="439" height="277" rx="17.5" fill="none" stroke="#94a3b8" stroke-opacity=".2"/>
<circle cx="34" cy="34" r="3.5" fill="#5eead4"/>
<text class="m" x="46" y="38.5" font-size="12" fill="#8b9bb4">razorpay buildathon</text>
<text class="s" x="32" y="90" font-size="27" font-weight="700" fill="#f1f5f9">Revive AI</text>
<text class="s" x="32" y="115" font-size="14.5" fill="#5eead4">Autonomous revenue recovery for Razorpay</text>
<text class="s" x="32" y="146" font-size="13.5" fill="#a9b6cc">AI only recommends. A deterministic policy</text><text class="s" x="32" y="166" font-size="13.5" fill="#a9b6cc">engine decides, and every execution is gated</text><text class="s" x="32" y="186" font-size="13.5" fill="#a9b6cc">by a live Razorpay re-check. A 5-webhook storm</text><text class="s" x="32" y="206" font-size="13.5" fill="#a9b6cc">exposed a race condition, fixed before shipping.</text>
<rect x="32" y="228" width="77.2" height="26" rx="13" fill="#5eead4" fill-opacity=".09" stroke="#5eead4" stroke-opacity=".38"/><text class="m" x="43" y="245" font-size="11.5" fill="#5eead4" textLength="55.2" lengthAdjust="spacing">Razorpay</text><rect x="117.2" y="228" width="77.2" height="26" rx="13" fill="#5eead4" fill-opacity=".09" stroke="#5eead4" stroke-opacity=".38"/><text class="m" x="128.2" y="245" font-size="11.5" fill="#5eead4" textLength="55.2" lengthAdjust="spacing">Webhooks</text><rect x="202.4" y="228" width="111.7" height="26" rx="13" fill="#5eead4" fill-opacity=".09" stroke="#5eead4" stroke-opacity=".38"/><text class="m" x="213.4" y="245" font-size="11.5" fill="#5eead4" textLength="89.7" lengthAdjust="spacing">Policy engine</text>
<line x1="302" y1="50" x2="336" y2="50" stroke="#5eead4" stroke-opacity=".35"/><line x1="356" y1="50" x2="390" y2="50" stroke="#5eead4" stroke-opacity=".35"/><circle cx="292" cy="50" r="10" fill="#5eead4" fill-opacity="0.15" stroke="#5eead4" stroke-width="1.5"><animate attributeName="fill-opacity" values="1;.15;.15" keyTimes="0;0.25;1" dur="3.6s" repeatCount="indefinite"/></circle><circle cx="346" cy="50" r="10" fill="#5eead4" fill-opacity="0.15" stroke="#5eead4" stroke-width="1.5"><animate attributeName="fill-opacity" values=".15;.15;1;.15;.15" keyTimes="0;0.3;0.45;0.62;1" dur="3.6s" repeatCount="indefinite"/></circle><circle cx="400" cy="50" r="10" fill="#5eead4" fill-opacity="0.15" stroke="#5eead4" stroke-width="1.5"><animate attributeName="fill-opacity" values=".15;.15;1;.15" keyTimes="0;0.72;0.9;1" dur="3.6s" repeatCount="indefinite"/></circle><path d="M395 50.5 l3.4 3.4 l6.6 -7" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="292" y="55" font-size="9.5" font-weight="700" text-anchor="middle" fill="#fff">AI</text><text class="m" x="292" y="80" font-size="10" text-anchor="middle" fill="#8b9bb4">recommend</text><text class="m" x="346" y="80" font-size="10" text-anchor="middle" fill="#8b9bb4">decide</text><text class="m" x="400" y="80" font-size="10" text-anchor="middle" fill="#8b9bb4">verify</text><g opacity="0"><circle r="6" fill="#fff" opacity=".25"/><circle r="2.6" fill="#fff"/><animateMotion path="M292 50 L400 50" dur="3.6s" keyPoints="0;1;1" keyTimes="0;0.9;1" calcMode="linear" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.85;0.9;1" dur="3.6s" repeatCount="indefinite"/></g>

</svg>
