<svg xmlns="http://www.w3.org/2000/svg" width="440" height="278" viewBox="0 0 440 278" role="img" aria-label="Terminal-Talk: Peer-to-peer encrypted chat on raw TCP sockets">
<title>Terminal-Talk: Peer-to-peer encrypted chat on raw TCP sockets</title>
<defs>
<style>.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace;} .s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;}</style>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1424"/><stop offset="1" stop-color="#0a0f1c"/></linearGradient>
<radialGradient id="gl" cx="430" cy="0" r="240" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fbbf24" stop-opacity=".2"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
<clipPath id="cp"><rect width="440" height="278" rx="18"/></clipPath>

</defs>

<g clip-path="url(#cp)"><rect width="440" height="278" fill="url(#bg)"/><rect width="440" height="278" fill="url(#gl)"/></g>
<rect x=".5" y=".5" width="439" height="277" rx="17.5" fill="none" stroke="#94a3b8" stroke-opacity=".2"/>
<circle cx="34" cy="34" r="3.5" fill="#fbbf24"/><circle cx="34" cy="34" r="4" fill="none" stroke="#fbbf24" stroke-width="1.2"><animate attributeName="r" values="4;11" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="2.2s" repeatCount="indefinite"/></circle>
<text class="m" x="46" y="38.5" font-size="12" fill="#8b9bb4">in progress</text>
<text class="s" x="32" y="90" font-size="27" font-weight="700" fill="#f1f5f9">Terminal-Talk</text>
<text class="s" x="32" y="115" font-size="14.5" fill="#fbbf24">Peer-to-peer encrypted chat on raw TCP sockets</text>
<text class="s" x="32" y="146" font-size="13.5" fill="#a9b6cc">No WebRTC, no framework hiding the network layer.</text><text class="s" x="32" y="166" font-size="13.5" fill="#a9b6cc">Custom framing, persistent identities, encrypted</text><text class="s" x="32" y="186" font-size="13.5" fill="#a9b6cc">history. And a real NAT-traversal experiment that</text><text class="s" x="32" y="206" font-size="13.5" fill="#a9b6cc">failed predictably, and got measured, not hidden.</text>
<rect x="32" y="228" width="70.3" height="26" rx="13" fill="#fbbf24" fill-opacity=".09" stroke="#fbbf24" stroke-opacity=".38"/><text class="m" x="43" y="245" font-size="11.5" fill="#fbbf24" textLength="48.3" lengthAdjust="spacing">Raw TCP</text><rect x="110.30000000000001" y="228" width="84.1" height="26" rx="13" fill="#fbbf24" fill-opacity=".09" stroke="#fbbf24" stroke-opacity=".38"/><text class="m" x="121.30000000000001" y="245" font-size="11.5" fill="#fbbf24" textLength="62.1" lengthAdjust="spacing">Encrypted</text><rect x="202.4" y="228" width="111.7" height="26" rx="13" fill="#fbbf24" fill-opacity=".09" stroke="#fbbf24" stroke-opacity=".38"/><text class="m" x="213.4" y="245" font-size="11.5" fill="#fbbf24" textLength="89.7" lengthAdjust="spacing">NAT traversal</text>
<line x1="300" y1="50" x2="390" y2="50" stroke="#fbbf24" stroke-opacity=".4" stroke-dasharray="3 4"/><circle cx="290" cy="50" r="9" fill="#0a0f1c" stroke="#fbbf24" stroke-width="1.6"/><circle cx="290" cy="50" r="3" fill="#fbbf24"/><text class="m" x="290" y="80" font-size="10" text-anchor="middle" fill="#8b9bb4">you</text><circle cx="400" cy="50" r="9" fill="#0a0f1c" stroke="#fbbf24" stroke-width="1.6"/><circle cx="400" cy="50" r="3" fill="#fbbf24"/><text class="m" x="400" y="80" font-size="10" text-anchor="middle" fill="#8b9bb4">peer</text><rect x="340" y="49" width="11" height="9" rx="2" fill="#fbbf24"/><path d="M342 49 v-3 a3.5 3.5 0 0 1 7 0 v3" fill="none" stroke="#fbbf24" stroke-width="1.6"/><g opacity="0"><circle r="5.5" fill="#fff" opacity=".22"/><circle r="2.4" fill="#fff"/><animateMotion path="M300 50 L390 50" dur="2.4s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.4s" begin="0s" repeatCount="indefinite"/></g><g opacity="0"><circle r="5.5" fill="#fff" opacity=".22"/><circle r="2.4" fill="#fff"/><animateMotion path="M300 50 L390 50" dur="2.4s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></g><g opacity="0"><circle r="5.5" fill="#fff" opacity=".22"/><circle r="2.4" fill="#fff"/><animateMotion path="M390 50 L300 50" dur="2.4s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></g><g opacity="0"><circle r="5.5" fill="#fff" opacity=".22"/><circle r="2.4" fill="#fff"/><animateMotion path="M390 50 L300 50" dur="2.4s" begin="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.4s" begin="1.8s" repeatCount="indefinite"/></g>

</svg>
