<svg xmlns="http://www.w3.org/2000/svg" width="440" height="238" viewBox="0 0 440 238" role="img" aria-label="FocusZen: Focus-tracking Chrome extension">
<title>FocusZen: Focus-tracking Chrome extension</title>
<defs>
<style>.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace;} .s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;}</style>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1424"/><stop offset="1" stop-color="#0a0f1c"/></linearGradient>
<radialGradient id="gl" cx="430" cy="0" r="240" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#818cf8" stop-opacity=".2"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
<clipPath id="cp"><rect width="440" height="238" rx="18"/></clipPath>

</defs>

<g clip-path="url(#cp)"><rect width="440" height="238" fill="url(#bg)"/><rect width="440" height="238" fill="url(#gl)"/></g>
<rect x=".5" y=".5" width="439" height="237" rx="17.5" fill="none" stroke="#94a3b8" stroke-opacity=".2"/>
<circle cx="34" cy="34" r="3.5" fill="#818cf8"/><circle cx="34" cy="34" r="4" fill="none" stroke="#818cf8" stroke-width="1.2"><animate attributeName="r" values="4;11" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="2.2s" repeatCount="indefinite"/></circle>
<text class="m" x="46" y="38.5" font-size="12" fill="#8b9bb4">on the chrome web store</text>
<text class="s" x="32" y="90" font-size="27" font-weight="700" fill="#f1f5f9">FocusZen</text>
<text class="s" x="32" y="115" font-size="14.5" fill="#818cf8">Focus-tracking Chrome extension</text>
<text class="s" x="32" y="146" font-size="13.5" fill="#a9b6cc">Published on the Chrome Web Store, paired with a</text><text class="s" x="32" y="166" font-size="13.5" fill="#a9b6cc">React dashboard for session analytics.</text>
<rect x="32" y="188" width="132.4" height="26" rx="13" fill="#818cf8" fill-opacity=".09" stroke="#818cf8" stroke-opacity=".38"/><text class="m" x="43" y="205" font-size="11.5" fill="#818cf8" textLength="110.4" lengthAdjust="spacing">Chrome extension</text><rect x="172.4" y="188" width="56.5" height="26" rx="13" fill="#818cf8" fill-opacity=".09" stroke="#818cf8" stroke-opacity=".38"/><text class="m" x="183.4" y="205" font-size="11.5" fill="#818cf8" textLength="34.5" lengthAdjust="spacing">React</text><rect x="236.9" y="188" width="84.1" height="26" rx="13" fill="#818cf8" fill-opacity=".09" stroke="#818cf8" stroke-opacity=".38"/><text class="m" x="247.9" y="205" font-size="11.5" fill="#818cf8" textLength="62.1" lengthAdjust="spacing">Analytics</text>
<circle cx="388" cy="52" r="24" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="5"/><circle cx="388" cy="52" r="24" fill="none" stroke="#818cf8" stroke-width="5" stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="150.8" transform="rotate(-90 388 52)"><animate attributeName="stroke-dashoffset" values="150.8;0;0;150.8" keyTimes="0;0.8;0.93;1" dur="7s" repeatCount="indefinite"/></circle><text class="m" x="388" y="55.5" font-size="10" text-anchor="middle" fill="#8b9bb4">focus</text>

</svg>
